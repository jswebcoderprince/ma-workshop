<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0e0f">
<title>Workshop Schedule — design frame</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Design frame for the MA Engine Lab workshop app. Tokens carried over from the approved prototype. */
:root {
  --bg: #0b0e0f; --surface: #141a1c; --surface-2: #1b2325; --line: #263033; --line-soft: rgba(140,160,163,.10);
  --fg: #e8eff0; --muted: #8ca0a3; --accent: #00b3b5; --accent-ink: #042021;
  --parts: #d9a21b; --over: #e0623d; --notify: #a78bfa; --done: #5d6d70;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif; --body: "IBM Plex Sans", system-ui, sans-serif;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f2f5f5; --surface: #ffffff; --surface-2: #e9eff0; --line: #d2dcdd; --line-soft: rgba(17,24,26,.07);
  --fg: #11181a; --muted: #5c6c6e; --accent: #00797b; --accent-ink: #ffffff;
  --parts: #96690a; --over: #b8431f; --notify: #6d4fd6; --done: #9aa8aa; color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14.5px/1.5 var(--body); }
h1, h2, h3, h4 { font-family: var(--display); margin: 0; letter-spacing: .01em; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
.eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

.demo-banner { background: var(--notify); color: #120a2a; text-align: center; font-size: 12px; font-weight: 600; padding: 4px 12px; letter-spacing: .03em; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: calc(100vh - 26px); }
.side { background: var(--surface); border-right: 1px solid var(--line); padding: 18px 12px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 18px; }
.brand { padding: 0 8px; }
.brand .name { font-family: var(--display); font-size: 22px; font-weight: 700; line-height: 1.05; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 10px; background: none; border: 0; border-left: 3px solid transparent; border-radius: 4px; padding: 9px 10px; color: var(--muted); cursor: pointer; text-align: left; font-weight: 500; }
.nav button:hover { color: var(--fg); background: var(--surface-2); }
.nav button[aria-current="page"] { color: var(--fg); background: var(--surface-2); border-left-color: var(--accent); }
.nav svg { width: 18px; height: 18px; flex: none; }
.side .foot { margin-top: auto; padding: 0 8px; font-size: 12px; color: var(--muted); }
.bar { display: flex; align-items: center; gap: 12px; justify-content: space-between; flex-wrap: wrap; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--bg); position: sticky; top: 0; z-index: 6; }
.bar h1 { font-size: 26px; font-weight: 700; }
.bar .acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.content { padding: 18px 24px 90px; }

.btn { font-family: var(--display); font-size: 15px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent); border-radius: 4px; padding: 8px 14px; cursor: pointer; min-height: 38px; white-space: nowrap; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--accent); color: var(--accent); }
.btn.sm { font-size: 13px; padding: 4px 10px; min-height: 30px; }
.btn.notify { background: var(--notify); border-color: var(--notify); color: #120a2a; }
.iconbtn { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; width: 38px; height: 38px; cursor: pointer; color: var(--fg); }
.iconbtn:hover { border-color: var(--accent); color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { background: var(--surface); border: 0; border-right: 1px solid var(--line); padding: 7px 12px; cursor: pointer; color: var(--muted); font-weight: 500; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--accent); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; }
.card h3 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.field input, .field select, .field textarea { background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; width: 100%; }
.field textarea { min-height: 70px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.stack { display: flex; flex-direction: column; gap: 12px; }

.tag { display: inline-block; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; border-radius: 3px; padding: 1px 6px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.tag.scheduled { color: var(--fg); }
.tag.in_progress { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tag.waiting_parts { background: var(--parts); color: #1a1403; border-color: var(--parts); }
.tag.done { background: var(--done); color: #fff; border-color: var(--done); }
.tag.notify { background: var(--notify); color: #120a2a; border-color: var(--notify); }
.tag.over { background: var(--over); color: #1f0a05; border-color: var(--over); }

/* ---------- calendar ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.toolbar .range { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-size: 19px; font-weight: 600; }
.cal-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
.cal-layout > * { min-width: 0; }
.panel-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; align-items: start; }
.panel-list .plist { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.gridscroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.cg { display: grid; grid-template-columns: var(--nw) repeat(var(--U), minmax(var(--u), 1fr)); grid-template-rows: 46px; grid-auto-rows: 30px; position: relative; }
.cg > * { min-width: 0; }
.hd { grid-row: 1; height: 46px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); background: var(--surface-2); padding: 4px 4px 0; font-size: 11px; color: var(--muted); line-height: 1.2; overflow: visible; white-space: nowrap; }
.hd .mon { z-index: 2; }
.hd .dn { display: block; font-family: var(--display); font-size: 15px; font-weight: 700; color: var(--fg); }
.hd.today { background: color-mix(in srgb, var(--accent) 22%, var(--surface-2)); }
.hd.today .dn { color: var(--accent); }
.hd.sun, .hd.closed { background: var(--bg); }
.hd .mon { position: absolute; top: 2px; font-size: 10px; color: var(--accent); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.corner { grid-column: 1; grid-row: 1; height: 46px; position: sticky; left: 0; z-index: 4; background: var(--surface-2); border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 6px 10px; font-size: 11px; color: var(--muted); display: flex; align-items: flex-end; }
.mname { grid-column: 1; position: sticky; left: 0; z-index: 3; background: var(--surface-2); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 6px 10px; display: flex; flex-direction: column; justify-content: center; }
.mname b { font-family: var(--display); font-size: 16px; font-weight: 600; line-height: 1.1; }
.mname small { font-size: 11px; color: var(--muted); line-height: 1.2; }
.mname .warn { color: var(--over); font-weight: 600; }
.bgc { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background-image: linear-gradient(to right, var(--line-soft) 1px, transparent 1px); background-size: calc(100% / var(--n, 4)) 100%; cursor: copy; position: relative; }
.bgc.today { background-color: color-mix(in srgb, var(--accent) 7%, transparent); }
.bgc.sun { background: var(--bg); cursor: default; }
.bgc.closed { background: repeating-linear-gradient(135deg, var(--bg) 0 6px, var(--surface-2) 6px 12px); cursor: not-allowed; }
.bgc.off { background: repeating-linear-gradient(135deg, transparent 0 6px, color-mix(in srgb, var(--muted) 16%, transparent) 6px 12px); cursor: not-allowed; }
.bgc .offlbl { position: absolute; left: 4px; top: 6px; font-size: 10.5px; color: var(--muted); white-space: nowrap; pointer-events: none; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.past { background-color: color-mix(in srgb, var(--bg) 45%, transparent); }
.jb { z-index: 2; margin: 3px 1px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line); border-left: 3px solid var(--accent); font-size: 11.5px; line-height: 22px; padding: 0 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; text-align: left; color: var(--fg); }
.jb:hover { border-color: var(--accent); }
.jb.st-in_progress { background: color-mix(in srgb, var(--accent) 30%, var(--surface)); }
.jb.st-waiting_parts { border-left-color: var(--parts); background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--parts) 22%, var(--surface)) 0 6px, var(--surface-2) 6px 12px); }
.jb.st-done { opacity: .5; border-left-color: var(--done); }
.jb.notify { box-shadow: inset 0 0 0 2px var(--notify); border-left-color: var(--notify); }
.jb.conflict { box-shadow: inset 0 0 0 2px var(--over); border-left-color: var(--over); }
.jb .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; vertical-align: 1px; }
.sumc { border-right: 1px solid var(--line); background: var(--surface-2); font-size: 11px; text-align: center; line-height: 30px; font-weight: 600; color: var(--muted); overflow: hidden; white-space: nowrap; }
.sumc.lot { color: var(--accent); }
.sumc.none { color: var(--over); }
.sumlbl { grid-column: 1; position: sticky; left: 0; z-index: 3; background: var(--surface-2); border-right: 1px solid var(--line); padding: 0 10px; line-height: 30px; font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }

.plist { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.pitem { border: 1px solid var(--line); border-left: 3px solid var(--notify); border-radius: 4px; padding: 8px 10px; background: var(--surface-2); font-size: 13px; }
.pitem.earlier { border-left-color: var(--accent); }
.pitem b { font-weight: 600; }
.pitem .meta { color: var(--muted); font-size: 12px; }
.pitem .acts { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.pitem button.link { background: none; border: 0; padding: 0; color: var(--fg); font-weight: 600; cursor: pointer; text-align: left; }

/* day view */
.daystrip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 12px; }
.daystrip button { flex: 0 0 auto; min-width: 54px; background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 6px 4px; cursor: pointer; font-family: var(--display); line-height: 1.1; }
.daystrip button .w { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; }
.daystrip button .d { display: block; font-size: 19px; font-weight: 700; }
.daystrip button[aria-pressed="true"] { border-color: var(--accent); background: var(--surface-2); }
.daystrip button:disabled { opacity: .35; cursor: default; }
.daycards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.djob { display: block; width: 100%; text-align: left; background: var(--surface-2); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 4px; padding: 7px 9px; margin-top: 6px; cursor: pointer; }
.djob.st-waiting_parts { border-left-color: var(--parts); } .djob.st-done { opacity: .55; } .djob.notify { border-left-color: var(--notify); } .djob.conflict { border-left-color: var(--over); }
.djob .t { font-size: 12px; color: var(--muted); }
.djob .c { font-weight: 600; }
.freeline { font-size: 12.5px; color: var(--accent); margin-top: 8px; }

/* tables */
.tbl { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.tbl th { text-align: left; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); padding: 8px 10px; font-weight: 600; }
.tbl td { padding: 9px 10px; border-top: 1px solid var(--line); vertical-align: top; }
.tbl tr.click { cursor: pointer; } .tbl tr.click:hover td { background: var(--surface-2); }
.tblwrap { overflow-x: auto; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.chips button { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; cursor: pointer; color: var(--muted); }
.chips button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 30; border: 0; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--surface); border-left: 1px solid var(--line); z-index: 31; overflow-y: auto; padding: 20px 20px calc(28px + env(safe-area-inset-bottom, 0px)); box-shadow: -14px 0 40px rgba(0,0,0,.35); }
.drawer .x { position: absolute; top: 10px; right: 10px; background: none; border: 0; font-size: 28px; color: var(--muted); width: 44px; height: 44px; cursor: pointer; }
.drawer h2 { font-size: 24px; font-weight: 700; padding-right: 40px; }
.drawer dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 12px 0 16px; font-size: 13.5px; }
.drawer dt { color: var(--muted); } .drawer dd { margin: 0; font-weight: 500; }
.drawer section { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
.drawer section h4 { font-size: 15px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 8px; }
.banner { border-radius: 5px; padding: 10px 12px; font-size: 13.5px; margin-top: 10px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.banner.notify { background: color-mix(in srgb, var(--notify) 18%, var(--surface)); border: 1px solid var(--notify); }
.banner.over { background: color-mix(in srgb, var(--over) 16%, var(--surface)); border: 1px solid var(--over); }
.btnrow { display: flex; gap: 6px; flex-wrap: wrap; }
.slotres { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.slotres .r { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; }
.slotres .r.best { border-color: var(--accent); }
.slotres .when { font-family: var(--display); font-size: 18px; font-weight: 600; line-height: 1.1; }

/* print sheet */
.sheetwrap { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.6); overflow: auto; padding: 20px 12px 60px; }
.sheetbar { max-width: 210mm; margin: 0 auto 10px; display: flex; justify-content: flex-end; gap: 8px; }
.sheet { width: 210mm; max-width: 100%; min-height: 297mm; margin: 0 auto; background: #fff; color: #111; padding: 14mm 14mm; font: 11pt/1.45 var(--body); box-shadow: 0 10px 40px rgba(0,0,0,.4); }
.sheet h1 { font-family: var(--display); font-size: 24pt; margin: 0; }
.sheet .hdr { display: flex; justify-content: space-between; gap: 20px; border-bottom: 2px solid #111; padding-bottom: 8px; margin-bottom: 14px; }
.sheet .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 14px; }
.sheet .box { border: 1px solid #bbb; padding: 8px 10px; }
.sheet .box .l { font-size: 8pt; text-transform: uppercase; letter-spacing: .08em; color: #666; font-weight: 600; }
.sheet table { width: 100%; border-collapse: collapse; margin: 6px 0 12px; }
.sheet th, .sheet td { border: 1px solid #bbb; padding: 5px 7px; text-align: left; font-size: 10pt; }
.sheet th { background: #eee; font-size: 8.5pt; text-transform: uppercase; letter-spacing: .05em; }
.sheet td.r, .sheet th.r { text-align: right; }
.sheet .lines td { height: 26px; }
.sheet .notes { border: 1px solid #bbb; min-height: 120px; padding: 8px; }
.sheet .sign { display: flex; justify-content: space-between; gap: 30px; margin-top: 26px; }
.sheet .sign div { flex: 1; border-top: 1px solid #111; padding-top: 4px; font-size: 9pt; color: #444; }
.sheet .totals { width: 50%; margin-left: auto; }
.sheet .totals td { border: 0; border-bottom: 1px solid #ddd; }
.sheet .totals tr:last-child td { font-weight: 700; font-size: 12pt; border-bottom: 2px solid #111; }
.sheet .demo { color: #b8431f; font-size: 8pt; }

.toast { position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 5px; z-index: 50; font-weight: 500; }
.tabbar { display: none; }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; align-items: start; }
.switch { display: flex; gap: 8px; align-items: center; font-size: 14px; }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .bar { padding: 10px 16px; } .bar h1 { font-size: 22px; }
  .content { padding: 14px 16px 96px; }
  .tabbar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding: 4px 4px calc(4px + env(safe-area-inset-bottom, 0px)); }
  .tabbar button { flex: 1; background: none; border: 0; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; padding: 6px 0; cursor: pointer; min-height: 48px; }
  .tabbar button[aria-current="page"] { color: var(--accent); }
  .tabbar svg { width: 20px; height: 20px; }
  .row3 { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 520px) { .row2, .row3 { grid-template-columns: 1fr; } .bar .acts .btn.ghost .lbl { display: none; } }
@media print {
  body * { visibility: hidden; }
  .sheet, .sheet * { visibility: visible; }
  .sheetwrap { position: static; background: none; padding: 0; overflow: visible; }
  .sheet { position: absolute; left: 0; top: 0; box-shadow: none; width: 100%; padding: 0; }
  @page { size: A4; margin: 12mm; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="demo-banner" id="demoBanner"></div>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="eyebrow">MA Engine Lab · Prienai</div>
      <div class="name" data-t="appName"></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">v1 · <span data-t="frameNote"></span></div>
  </aside>
  <main>
    <header class="bar">
      <h1 id="title"></h1>
      <div class="acts" id="baracts"></div>
    </header>
    <div class="content" id="view"></div>
  </main>
</div>
<nav class="tabbar" id="tabbar"></nav>
<div id="overlay"></div>

<script>
(function () {
"use strict";

/* ================= i18n ================= */
var T = {
  appName: ["Workshop schedule", "Dirbtuvių grafikas"],
  frameNote: ["design frame", "dizaino maketas"],
  demoBanner: ["Design frame · sample data · changes are not saved", "Dizaino maketas · pavyzdiniai duomenys · pakeitimai neišsaugomi"],
  calendar: ["Calendar", "Kalendorius"], jobs: ["Jobs", "Darbai"], customers: ["Customers", "Klientai"],
  mechanics: ["Mechanics", "Mechanikai"], invoices: ["Invoices", "Sąskaitos"], settings: ["Settings", "Nustatymai"],
  newJob: ["New job", "Naujas darbas"], findSlot: ["Find a free slot", "Rasti laisvą laiką"],
  month: ["Month", "Mėnuo"], week: ["Week", "Savaitė"], day: ["Day", "Diena"], today: ["Today", "Šiandien"],
  freeDays: ["Free, days", "Laisva, d."], mechanic: ["Mechanic", "Mechanikas"],
  st_scheduled: ["Scheduled", "Suplanuota"], st_in_progress: ["In progress", "Vykdoma"],
  st_waiting_parts: ["Waiting for parts", "Laukiama detalių"], st_done: ["Completed", "Atlikta"],
  contactTitle: ["Customers to contact", "Reikia susisiekti"],

function unitsOf(d) { var w = dow(d); if (w === 6) return 1; return w === 5 ? 2 : 4; }

function gridView() {
  var N = rangeLen(), start = state.start, pos = {}, U = 0;
  for (var d = start; d < start + N; d++) { pos[d] = U; U += unitsOf(d); }
  var u = state.view === "month" ? 9 : 24, nw = 132;
  var h = '<div class="gridscroll"><div class="cg" style="--U:' + U + ";--u:" + u + "px;--nw:" + nw + 'px">';
  h += '<div class="corner">' + t("mechanic") + "</div>";
  var lastMonth = -1;
  for (d = start; d < start + N; d++) {

    var m = dt(d).getUTCMonth(), label = "";
    if (m !== lastMonth && dow(d) !== 6) { label = '<span class="mon">' + (lang === "lt" ? MONN.lt[m] : MONN.en[m]) + "</span>"; lastMonth = m; }
    var title = fmtDate(d) + (CLOSURES[d] ? " · " + CLOSURES[d][lang === "lt" ? 1 : 0] : "");
    h += '<div class="' + cls + '" style="grid-column:' + (pos[d] + 2) + " / span " + unitsOf(d) + ';position:relative" title="' + esc(title) + '">' +
      (dow(d) === 6 ? "" : label + '<span class="dn" style="margin-top:' + (label ? 10 : 10) + 'px">' + dt(d).getUTCDate() + "</span>" + (u * unitsOf(d) > 20 ? WD[lang][dow(d)] : "")) + "</div>";
  }
  var row = 2;
  MECHS.forEach(function (m) {
    // segments + lanes
    var segsAll = [], vis = JOBS.filter(function (j) { return j.mech === m.id; }).sort(function (a, b) { return sIdx(a) - sIdx(b) || (blocks(a) ? 1 : -1); });
    var laneEnd = [];
    vis.forEach(function (j) {
      var runs = [], cur = null;
      for (var i = sIdx(j); i < eIdx(j); i++) {
        var w = WQ[i]; if (pos[w.d] === undefined) { cur = null; continue; }
        var p = pos[w.d] + w.q;
        if (cur && p === cur.e) cur.e = p + 1; else { cur = { s: p, e: p + 1 }; runs.push(cur); }
      }
      if (!runs.length) return;
      var lane = 0; while (laneEnd[lane] !== undefined && laneEnd[lane] > sIdx(j)) lane++;
      laneEnd[lane] = eIdx(j);
      runs.forEach(function (r) { segsAll.push({ j: j, r: r, lane: lane }); });
    });
    var L = Math.max(1, laneEnd.length), cnt = JOBS.filter(function (j) { return j.mech === m.id && conflict(j); }).length;
    var sk = m.skills.map(function (s) { return t(s); }).join(", ");

      (cnt ? '<small class="warn">⚠ ' + cnt + " " + t("conflictTag").toLowerCase() + "</small>" : "") + "</div>";
    for (d = start; d < start + N; d++) {
      var off = offType(m.id, d), c = "bgc", lbl = "";

      else if (CLOSURES[d]) c += " closed";
      else if (off || m.days.indexOf(dow(d)) === -1) { c += " off"; if (off && (d === start || offType(m.id, d - 1) !== off || dow(d) === 0)) lbl = '<span class="offlbl">' + t(off) + "</span>"; }

    }
    segsAll.forEach(function (s) {
      var j = s.j, c = cust(j.c), cf = conflict(j);
      var cls = "jb st-" + j.status + (j.notify ? " notify" : "") + (cf ? " conflict" : "");
      var text = c.name.split(" ").slice(-1)[0] + " · " + c.vehicles[0].make;
      var tip = c.name + " — " + c.vehicles[0].make + "\n" + j.work + "\n" + startLabel(j) + " → " + endLabel(j) + " (" + fmtDays(j.dur) + ")\n" + t("st_" + j.status);

  for (d = start; d < start + N; d++) {
    var free = 0;

    });

  var e = WQ[s + dur - 1], o = occ(mid), m = mech(mid), bad = null;
  for (var i = s; i < s + dur; i++) { if (o[i]) { bad = "overlap"; break; } if (!avail(m, WQ[i].d)) { bad = "off"; break; } }
  box.innerHTML = '<div class="muted" style="font-size:13px">' + t("willEnd") + ": <b style=\"color:var(--fg)\">" + fmtDate(e.d) + " " + qTime(e.d, e.q + 1) + "</b></div>" +
    (bad ? '<div class="banner over">⚠ ' + t(bad === "overlap" ? "overlap" : "offOverlap") + "</div>" : "");
}

/* ================= print sheets ================= */
function company() { return { name: "MA Engine Lab", code: "000000000", vat: "LT000000000", addr: "Prienai, Lietuva", bank: "LT00 0000 0000 0000 0000", phone: "+370 600 00000" }; }
function openSheet(html) {

function jobCard(id) {
  var j = job(id), c = cust(j.c), v = c.vehicles[0], co = company();
  var h = '<div class="hdr"><div><h1>' + t("jobCard") + '</h1><div>' + t("jobNo") + " <b>" + String(j.id).padStart(4, "0") + "</b></div></div><div style=\"text-align:right\"><b>" + co.name + "</b><br>" + co.addr + "<br>" + co.phone + "</div></div>";
  h += '<div class="grid2"><div class="box"><div class="l">' + t("customer") + "</div><b>" + esc(c.name) + "</b><br>" + c.phone + '</div><div class="box"><div class="l">' + t("vehicle") + "</div><b>" + esc(v.make) + " " + v.year + "</b><br>" + t("plate") + ": " + v.plate + "<br>" + t("vin") + ": ____________________<br>" + t("mileage") + ": __________</div></div>";
  h += '<div class="grid2"><div class="box"><div class="l">' + t("mechanic") + "</div><b>" + mech(j.mech).name + '</b></div><div class="box"><div class="l">' + t("planned") + "</div>" + startLabel(j) + " → " + endLabel(j) + " (" + fmtDays(j.dur) + ")</div></div>";
  h += '<div class="box" style="margin-bottom:14px"><div class="l">' + t("work") + '</div><div style="font-size:12pt;font-weight:600">' + esc(j.work) + "</div></div>";
  h += '<div class="l" style="font-size:8pt;text-transform:uppercase;letter-spacing:.08em;color:#666;font-weight:600">' + t("partsUsed") + '</div><table class="lines"><thead><tr><th>' + t("item") + '</th><th class="r" style="width:16%">' + t("qty") + '</th><th style="width:30%">' + t("mechNotes") + "</th></tr></thead><tbody>" + "<tr><td></td><td></td><td></td></tr>".repeat(7) + "</tbody></table>";
  h += '<div class="l" style="font-size:8pt;text-transform:uppercase;letter-spacing:.08em;color:#666;font-weight:600">' + t("mechNotes") + '</div><div class="notes"></div>';
  h += '<div class="sign"><div>' + t("received") + " · " + t("signature") + "</div><div>" + t("mechanic") + " · " + t("signature") + "</div></div>";

function invLines(j) {
  var hrs = j.dur * 2.5;
  return [{ n: t("labour") + ": " + j.work, q: hrs, u: t("hUnit"), p: VAT.hourRate }, { n: "Variklio alyva 5W-30, 5 l", q: 1, u: t("pcs"), p: 42 }, { n: "Alyvos filtras", q: 1, u: t("pcs"), p: 12.5 }];
}
function invTotals(j) {
  var sub = invLines(j).reduce(function (a, l) { return a + l.q * l.p; }, 0), vat = VAT.payer ? Math.round(sub * VAT.rate) / 100 : 0;
  return { sub: sub, vat: vat, total: sub + vat };
}
function invoice(id) {
  var j = job(id), c = cust(j.c), co = company(), inv = INVOICES.filter(function (x) { return x.job === id; })[0];
  var no = inv ? inv.no : VAT.series + "-" + String(VAT.next).padStart(4, "0") + " (draft)", tot = invTotals(j);
  var h = '<div class="hdr"><div><h1>' + t(VAT.payer ? "vatInvoice" : "invoice") + "</h1><div>" + t("invNo") + " <b>" + no + "</b></div><div>" + t("dateIssued") + ": " + iso(0) + "</div><div>" + t("payBy") + ": " + iso(VAT.payDays) + '</div></div><div style="text-align:right"><b style="font-size:13pt">' + co.name + '</b><div class="demo">demo</div></div></div>';
  h += '<div class="grid2"><div class="box"><div class="l">' + t("seller") + "</div><b>" + co.name + "</b><br>" + t("companyCode") + ": " + co.code + (VAT.payer ? "<br>" + t("vatCode") + ": " + co.vat : "") + "<br>" + co.addr + "<br>" + t("bank") + ": " + co.bank + '</div><div class="box"><div class="l">' + t("buyer") + "</div><b>" + esc(c.name) + "</b><br>" + c.phone + "<br>" + esc(c.vehicles[0].make) + " · " + c.vehicles[0].plate + "</div></div>";
  h += "<table><thead><tr><th>#</th><th>" + t("item") + '</th><th class="r">' + t("qty") + "</th><th>" + t("unit") + '</th><th class="r">' + t("price") + '</th><th class="r">' + t("amount") + "</th></tr></thead><tbody>";
  invLines(j).forEach(function (l, i) { h += "<tr><td>" + (i + 1) + "</td><td>" + esc(l.n) + '</td><td class="r">' + String(l.q).replace(".", lang === "lt" ? "," : ".") + "</td><td>" + l.u + '</td><td class="r">' + money(l.p) + '</td><td class="r">' + money(l.q * l.p) + "</td></tr>"; });
  h += '</tbody></table><table class="totals"><tbody>' + (VAT.payer ? "<tr><td>" + t("subtotal") + '</td><td class="r">' + money(tot.sub) + "</td></tr><tr><td>" + t("vat") + " " + VAT.rate + '%</td><td class="r">' + money(tot.vat) + "</td></tr>" : "") +
    "<tr><td>" + t(VAT.payer ? "total" : "totalNoVat") + '</td><td class="r">' + money(tot.total) + "</td></tr></tbody></table>";
  h += '<div class="sign"><div>' + t("issuedBy") + "</div><div>" + t("buyer") + " · " + t("signature") + '</div></div><p class="demo" style="margin-top:18px">' + t("editLines") + "</p>";
  openSheet(h);

/* ================= events ================= */
document.addEventListener("click", function (e) {
  var b = e.target.closest("button, tr.click, [data-act]");
  if (!b) return;
  var a = b.dataset;
  if (a.page) { state.page = a.page; closeOverlay(); render(); window.scrollTo(0, 0); return; }
  if (a.view) { state.view = a.view; if (a.view === "day") state.dayPick = Math.max(state.start, 0); render(); return; }
  if (a.pick) { state.dayPick = +a.pick; render(); return; }
  if (a.job && !a.status) { openJob(+a.job); return; }
  if (a.cust) { openCustomer(+a.cust); return; }
  if (a.filter) { state.jobFilter = a.filter; render(); return; }
  if (a.lang) { lang = a.lang; try { localStorage.setItem("maw-lang", lang); } catch (x) {} render(); return; }
  if (a.informed) { job(+a.informed).notify = null; closeOverlay(); render(); toast(t("toastSaved")); return; }
  if (a.moveearly) { var p = a.moveearly.split(":"), jj = job(+p[0]), w = WQ[+p[1]]; jj.d = w.d; jj.q = w.q; jj.notify = "earlier"; render(); toast(t("toastMoved")); return; }
  if (a.status) { var s = a.status.split(":"); job(+s[0]).status = s[1]; render(); openJob(+s[0]); return; }
  if (a.dur) { var x = a.dur.split(":"), j = job(+x[0]); j.dur = Math.max(1, j.dur + (+x[1])); render(); openJob(j.id); return; }
  if (a.finish) { var jf = job(+a.finish); jf.dur = Math.max(1, NOW + 1 - sIdx(jf)); jf.status = "done"; closeOverlay(); render(); toast(t("toastSaved")); return; }
  if (a.move) {
    var jm = job(+a.move), nd = fromIso($("mvD").value), nq = +$("mvQ").value;
    if (qi(nd, nq) < 0) { toast(t("toastClosed")); return; }
    var before = sIdx(jm); jm.mech = $("mvM").value; jm.d = nd; jm.q = nq;
    if (qi(nd, nq) !== before && jm.status === "scheduled") jm.notify = qi(nd, nq) < before ? "earlier" : "later";
    render(); openJob(jm.id); toast(t("toastMoved")); return;
  }
  if (a.card) { jobCard(+a.card); return; }
  if (a.invoice) { invoice(+a.invoice); return; }
  if (a.book) { var bk = a.book.split(":"); openNew({ m: bk[0], d: +bk[1], q: +bk[2], dur: +bk[3], vt: bk[4] }); return; }
  if (a.ctab) { $("cEx").hidden = a.ctab !== "ex"; $("cNew").hidden = a.ctab === "ex"; b.parentNode.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", x === b); }); return; }
  switch (a.act) {
    case "close": closeOverlay(); break;
    case "theme": state.theme = state.theme === "dark" ? "light" : "dark"; try { localStorage.setItem("maw-theme", state.theme); } catch (x) {} render(); break;
    case "prev": state.start -= state.view === "month" ? 28 : 7; render(); break;
    case "next": state.start += state.view === "month" ? 28 : 7; render(); break;
    case "today": state.start = 0; state.dayPick = 0; render(); break;
    case "find": openFind(); break;
    case "new": openNew(); break;
    case "saved": toast(t("toastSaved")); break;
    case "print": window.print(); break;
    case "saveNew":
      var nd2 = fromIso($("nD").value), nq2 = +$("nQ").value;
      if (qi(nd2, nq2) < 0) { toast(t("toastClosed")); break; }
      var cn = $("cSearch") ? $("cSearch").value : "", found = CUST.filter(function (c) { return c.name === cn; })[0] || CUST[0];
      JOBS.push({ id: nextId++, c: found.id, work: $("nWork").value || "—", mech: $("nM").value, d: nd2, q: nq2, dur: +$("nDur").value, orig: +$("nDur").value, status: "scheduled", notify: null });
      closeOverlay(); render(); toast(t("toastSaved")); break;
  }
});
// click on an empty spot in the grid
document.addEventListener("click", function (e) {
  var c = e.target.closest(".bgc"); if (!c || c.classList.contains("sun") || c.classList.contains("closed") || c.classList.contains("off")) return;
  var d = +c.dataset.d, u = c.getBoundingClientRect().width / unitsOf(d), q = Math.min(wsQ(d) - 1, Math.floor((e.clientX - c.getBoundingClientRect().left) / u));
  openNew({ m: c.dataset.m, d: d, q: q });
});
document.addEventListener("change", function (e) {
  var id = e.target.id;
  if (id === "fDur" || id === "fType") { openFind(+$("fDur").value, $("fType").value); return; }
  if (id === "nD" || id === "mvD") { var sel = id === "nD" ? "nQ" : "mvQ"; $(sel).innerHTML = quarterOptions(fromIso(e.target.value), 0); }
  if (["nD", "nQ", "nDur", "nM"].indexOf(id) !== -1) newInfo();
  if (id === "cSearch") { var c = CUST.filter(function (x) { return x.name === e.target.value; })[0]; $("cPick").textContent = c ? c.phone + " · " + vehLabel(c) : ""; }
  if (id === "vatPayer") { VAT.payer = e.target.checked; }
});
document.addEventListener("input", function (e) {
  if (e.target.id !== "cq") return;
  var q = e.target.value.toLowerCase();
  document.querySelectorAll("#ctbl tbody tr").forEach(function (r) { r.hidden = r.dataset.search.indexOf(q) === -1; });
});
document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeOverlay(); });

if (innerWidth < 760) state.view = "day";
render();
})();
