<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Workshop planner — design frame v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
/* Design frame v2. Product-UI conventions (Resource Guru / Float / Shopmonkey): light canvas,
   neutral greys, one brand accent (MA Engine Lab teal), status shown with soft fills. */
:root {
  --bg: #f6f7f7; --panel: #ffffff; --subtle: #f3f4f5; --hover: #f0f2f3; --line: #e6e8ea; --line-strong: #d3d7da;
  --fg: #101828; --fg-2: #344054; --muted: #667085; --faint: #98a2b3;
  --accent: #0b7d7f; --accent-hover: #086668; --accent-soft: #e7f4f4; --accent-line: #b7dcdc; --accent-ink: #075456;
  --prog: #0e8f91; --prog-ink: #ffffff;
  --parts-bg: #fff6e5; --parts-line: #f2cf86; --parts-ink: #8a5300;
  --done-bg: #f2f4f7; --done-ink: #98a2b3;
  --over-bg: #fef1f0; --over-line: #f4a39b; --over-ink: #b42318;
  --notify: #6e56cf; --notify-soft: #f1eefc;
  --off: #f4f5f6; --off-stripe: #e9ebed; --weekend: #fafafa;
  --shadow: 0 1px 2px rgba(16,24,40,.05); --shadow-lg: 0 12px 32px -8px rgba(16,24,40,.18), 0 4px 8px -4px rgba(16,24,40,.06);
  --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0e1113; --panel: #15191c; --subtle: #1b2024; --hover: #20262a; --line: #262c31; --line-strong: #323a40;
  --fg: #eceff1; --fg-2: #c9d0d5; --muted: #8d979e; --faint: #5f6a71;
  --accent: #2fb5b7; --accent-hover: #43c4c6; --accent-soft: rgba(47,181,183,.12); --accent-line: rgba(47,181,183,.35); --accent-ink: #7fd7d8;
  --prog: #168f91; --prog-ink: #ffffff;
  --parts-bg: rgba(242,177,52,.12); --parts-line: rgba(242,177,52,.45); --parts-ink: #f2c46b;
  --done-bg: #1c2125; --done-ink: #6b757c;
  --over-bg: rgba(240,82,70,.12); --over-line: rgba(240,82,70,.5); --over-ink: #ff8a80;
  --notify: #a593f5; --notify-soft: rgba(165,147,245,.14);
  --off: #171b1e; --off-stripe: #1f2427; --weekend: #121619;
  --shadow: none; --shadow-lg: 0 12px 32px -8px rgba(0,0,0,.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01"; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
svg.lucide { width: 16px; height: 16px; stroke-width: 1.75; flex: none; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.sidebar { background: var(--panel); border-right: 1px solid var(--line); position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 14px 10px; gap: 4px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; }
.logo { width: 30px; height: 30px; border-radius: 7px; background: #0f1416; display: grid; place-items: center; flex: none; }
.brand b { display: block; font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
.brand small { display: block; font-size: 12px; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 1px; }
.nav button { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 7px 10px; border-radius: 6px; color: var(--fg-2); font-weight: 500; text-align: left; }
.nav button:hover { background: var(--hover); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent-ink); }
.nav button svg { color: var(--muted); }
.nav button[aria-current="page"] svg { color: var(--accent); }
.nav .count { margin-left: auto; font-size: 12px; color: var(--muted); font-weight: 500; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding: 8px; }
.me { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.me small { display: block; color: var(--muted); font-size: 12px; }

.topbar { height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 24px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 10; }
.topbar h1 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: -.01em; white-space: nowrap; }
.search { position: relative; margin-left: 16px; flex: 0 1 360px; }
.search input { width: 100%; height: 34px; border: 1px solid var(--line); background: var(--subtle); border-radius: 8px; padding: 0 64px 0 34px; outline: none; }
.search input:focus { border-color: var(--accent); background: var(--panel); box-shadow: 0 0 0 3px var(--accent-soft); }
.search > svg { position: absolute; left: 10px; top: 9px; color: var(--muted); }
.search kbd { position: absolute; right: 8px; top: 7px; font: 500 11px var(--font); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; background: var(--panel); }
.qres { position: absolute; top: 40px; left: 0; right: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-lg); padding: 6px; z-index: 30; }
.qres button { display: flex; width: 100%; gap: 10px; align-items: center; border: 0; background: none; border-radius: 6px; padding: 8px; text-align: left; }
.qres button:hover { background: var(--hover); }
.qres .empty { padding: 10px; color: var(--muted); font-size: 13px; }
.topbar .acts { margin-left: auto; display: flex; gap: 8px; align-items: center; }

.page { padding: 20px 24px 40px; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--panel); color: var(--fg); font-weight: 500; font-size: 13.5px; box-shadow: var(--shadow); white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-hover); }
.btn.ghost { border-color: transparent; background: none; box-shadow: none; }
.btn.ghost:hover { background: var(--hover); }
.btn.sm { height: 28px; padding: 0 9px; font-size: 13px; border-radius: 6px; }
.btn.icon { width: 34px; padding: 0; justify-content: center; }
.btn.sm.icon { width: 28px; }
.btn .pill { background: var(--notify); color: #fff; border-radius: 999px; font-size: 11px; font-weight: 600; min-width: 18px; height: 18px; display: inline-grid; place-items: center; padding: 0 5px; }
.seg { display: inline-flex; background: var(--subtle); border: 1px solid var(--line); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: none; height: 28px; padding: 0 12px; border-radius: 6px; color: var(--muted); font-weight: 500; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--fg); box-shadow: 0 1px 2px rgba(16,24,40,.08), 0 0 0 1px var(--line); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--panel); font-size: 13px; font-weight: 500; color: var(--fg-2); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-ink); }
.badge { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 500; background: var(--subtle); color: var(--fg-2); border: 1px solid var(--line); white-space: nowrap; }
.badge .d { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.scheduled { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent-line); }
.badge.in_progress { background: var(--prog); color: var(--prog-ink); border-color: var(--prog); }
.badge.waiting_parts { background: var(--parts-bg); color: var(--parts-ink); border-color: var(--parts-line); }
.badge.completed { background: var(--done-bg); color: var(--muted); }
.badge.notify { background: var(--notify-soft); color: var(--notify); border-color: transparent; }
.badge.over { background: var(--over-bg); color: var(--over-ink); border-color: var(--over-line); }
.badge.sample { background: var(--parts-bg); color: var(--parts-ink); border-color: var(--parts-line); }
.av { width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font-size: 12px; font-weight: 600; flex: none; letter-spacing: .02em; }
.av.sm { width: 24px; height: 24px; font-size: 10.5px; }
.av.cust { background: var(--subtle); color: var(--fg-2); border: 1px solid var(--line); }
.plate { display: inline-flex; align-items: stretch; border: 1px solid #1f2937; border-radius: 4px; overflow: hidden; font: 600 12px/1 var(--mono); background: #fff; color: #111; height: 22px; white-space: nowrap; }
.plate i { font-style: normal; background: #1d3fa8; color: #ffd84d; font: 700 9px/1 var(--font); width: 15px; display: grid; place-items: end center; padding-bottom: 3px; }
.plate span { padding: 0 6px; display: grid; place-items: center; letter-spacing: .04em; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label { font-size: 13px; font-weight: 500; color: var(--fg-2); }
.input, .field input, .field select, .field textarea { height: 36px; border: 1px solid var(--line-strong); border-radius: 8px; padding: 0 10px; background: var(--panel); width: 100%; outline: none; box-shadow: var(--shadow); }
.field textarea { height: auto; min-height: 76px; padding: 8px 10px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus, .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.hint { font-size: 12.5px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spacer { flex: 1; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.card-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.card-h h3 { margin: 0; font-size: 14px; font-weight: 600; }
.card-b { padding: 16px; }

/* ---------- calendar ---------- */
.toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.toolbar .range { font-size: 16px; font-weight: 600; letter-spacing: -.01em; margin: 0 6px; }
.strip { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 8px 8px 14px; margin-bottom: 12px; font-size: 13.5px; box-shadow: var(--shadow); }
.strip .it { display: inline-flex; align-items: center; gap: 7px; color: var(--fg-2); }
.strip .it b { font-weight: 600; color: var(--fg); }
.strip .ic { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; }
.strip .ic.n { background: var(--notify-soft); color: var(--notify); }
.strip .ic.e { background: var(--accent-soft); color: var(--accent); }
.strip .ic.o { background: var(--over-bg); color: var(--over-ink); }
.strip .ic svg { width: 14px; height: 14px; }
.board { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.cg { display: grid; grid-template-columns: var(--nw) repeat(var(--U), minmax(var(--u), 1fr)); grid-template-rows: 26px 34px; grid-auto-rows: 40px; min-width: calc(var(--nw) + var(--U) * var(--u)); position: relative; }
.cg.week { grid-auto-rows: 48px; }
.cg > * { min-width: 0; }
.wk { grid-row: 1; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 5px 8px; font-size: 11.5px; color: var(--muted); font-weight: 500; white-space: nowrap; overflow: hidden; background: var(--panel); }
.wk b { color: var(--fg-2); font-weight: 600; margin-right: 6px; }
.dh { grid-row: 2; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; background: var(--panel); }
.dh b { color: var(--fg); font-weight: 600; font-size: 13px; }
.dh.today b { background: var(--accent); color: #fff; border-radius: 6px; padding: 1px 6px; }
.dh.today { color: var(--accent); font-weight: 600; }
.dh.sat, .dh.sun { background: var(--weekend); }
.dh.closed { background: var(--off); }
.corner { grid-column: 1; grid-row: 1 / span 2; position: sticky; left: 0; z-index: 5; background: var(--panel); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); display: flex; align-items: flex-end; padding: 8px 12px; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 500; }
.mrow { grid-column: 1; position: sticky; left: 0; z-index: 4; background: var(--panel); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; padding: 0 12px; }
.mrow .nm { min-width: 0; flex: 1; }
.mrow .nm b { display: block; font-weight: 600; font-size: 13.5px; line-height: 1.2; }
.mrow .nm small { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.load { font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 2px 7px; background: var(--subtle); color: var(--fg-2); border: 1px solid var(--line); }
.load.hi { background: var(--over-bg); color: var(--over-ink); border-color: var(--over-line); }
.load.mid { background: var(--parts-bg); color: var(--parts-ink); border-color: var(--parts-line); }
.load.lo { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent-line); }
.cell { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); position: relative; cursor: cell; }
.cell:hover { background: var(--hover); }
.cell.sat, .cell.sun { background: var(--weekend); }
.cell.sun { cursor: default; }
.cell.closed, .cell.off { cursor: not-allowed; background: repeating-linear-gradient(-45deg, var(--off) 0 6px, var(--off-stripe) 6px 7px); }
.cell.closed:hover, .cell.off:hover, .cell.sun:hover { background-color: inherit; }
.cell .lbl { position: absolute; left: 6px; top: 50%; transform: translateY(-50%); font-size: 11.5px; color: var(--muted); font-weight: 500; white-space: nowrap; pointer-events: none; display: inline-flex; gap: 4px; align-items: center; background: var(--panel); padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); }
.cell .lbl svg { width: 12px; height: 12px; }
.cell.today::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 2px; background: var(--accent); opacity: .5; }
.cell.past { background-color: color-mix(in srgb, var(--subtle) 70%, transparent); }
.blk { z-index: 2; margin: 5px 2px; border-radius: 6px; border: 1px solid var(--accent-line); background: var(--accent-soft); color: var(--accent-ink); font-size: 12px; line-height: 1.25; padding: 0 7px; display: flex; align-items: center; gap: 6px; overflow: hidden; white-space: nowrap; text-align: left; min-width: 0; }
.blk:hover { filter: brightness(.97); box-shadow: 0 0 0 1px var(--accent); }
.blk .t { overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.blk .t b { font-weight: 600; }
.blk .t small { display: block; font-size: 11.5px; opacity: .8; overflow: hidden; text-overflow: ellipsis; }
.blk .dur { font-size: 11px; font-weight: 600; opacity: .75; flex: none; }
.blk svg { width: 13px; height: 13px; flex: none; }
.blk.in_progress { background: var(--prog); border-color: var(--prog); color: var(--prog-ink); }
.blk.waiting_parts { background: repeating-linear-gradient(-45deg, var(--parts-bg) 0 7px, color-mix(in srgb, var(--parts-line) 35%, var(--parts-bg)) 7px 9px); border-color: var(--parts-line); color: var(--parts-ink); border-style: dashed; }
.blk.completed { background: var(--done-bg); border-color: var(--line); color: var(--done-ink); }
.blk.completed .t b { text-decoration: line-through; text-decoration-color: color-mix(in srgb, currentColor 50%, transparent); }
.blk.notify { box-shadow: 0 0 0 2px var(--notify); border-color: var(--notify); }
.blk.conflict { background: var(--over-bg); border-color: var(--over-line); color: var(--over-ink); }
.blk.conflict.in_progress { background: var(--over-ink); color: #fff; }
.cap { border-right: 1px solid var(--line); background: var(--subtle); display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 2px; padding: 4px 2px 0; overflow: hidden; }
.cap i { display: block; width: min(64%, 26px); border-radius: 3px 3px 0 0; background: var(--accent); opacity: .55; flex: none; }
.cap.none i { background: var(--over-ink); opacity: .55; }
.cap span { font-size: 10.5px; font-weight: 600; color: var(--fg-2); line-height: 1; white-space: nowrap; }
.cap.none span { color: var(--over-ink); }
.caplbl { grid-column: 1; position: sticky; left: 0; z-index: 4; background: var(--subtle); border-right: 1px solid var(--line); padding: 0 12px; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--fg-2); font-weight: 500; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-top: 12px; align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 14px; height: 10px; border-radius: 3px; display: inline-block; border: 1px solid var(--line); }

/* day / agenda */
.daystrip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; }
.daystrip button { flex: 0 0 auto; width: 52px; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 6px 0; display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 11.5px; color: var(--muted); }
.daystrip button b { font-size: 17px; color: var(--fg); font-weight: 600; }
.daystrip button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.daystrip button[aria-pressed="true"] b { color: #fff; }
.daystrip button:disabled { opacity: .4; cursor: default; }
.agenda { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.agenda .card-h { padding: 12px 14px; }
.agenda .card-b { padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.ajob { display: flex; gap: 10px; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 9px 10px; width: 100%; }
.ajob:hover { background: var(--hover); }
.ajob .tm { font-size: 12px; color: var(--muted); width: 74px; flex: none; padding-top: 1px; }
.ajob .tm b { display: block; color: var(--fg); font-size: 13px; font-weight: 600; }
.ajob .bd { min-width: 0; flex: 1; }
.ajob .bd b { display: block; font-weight: 600; }
.ajob .bd small { display: block; color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ajob .bd .row { margin-top: 6px; }
.free { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--accent-ink); background: var(--accent-soft); border: 1px dashed var(--accent-line); border-radius: 8px; padding: 7px 10px; }
.offbox { font-size: 13px; color: var(--muted); padding: 14px; text-align: center; background: repeating-linear-gradient(-45deg, var(--off) 0 6px, var(--off-stripe) 6px 7px); border-radius: 8px; }

/* tables */
.tablewrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13.5px; }
table.t th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12.5px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--subtle); white-space: nowrap; }
table.t th:first-child { border-top-left-radius: 12px; } table.t th:last-child { border-top-right-radius: 12px; }
table.t td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
table.t td.wrap { white-space: normal; min-width: 180px; }
table.t .row { flex-wrap: nowrap; }
table.t tr:last-child td { border-bottom: 0; }
table.t tr.click { cursor: pointer; }
table.t tr.click:hover td { background: var(--hover); }
.who { display: flex; align-items: center; gap: 10px; }
.who b { font-weight: 500; }
.who small { display: block; color: var(--muted); font-size: 12.5px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }

/* sheet (drawer) */
.scrim { position: fixed; inset: 0; background: rgba(16,24,40,.32); z-index: 40; border: 0; }

.when .w b { font-weight: 600; font-size: 14px; }

.banner.over { background: var(--over-bg); color: var(--over-ink); }

.list { display: flex; flex-direction: column; }
.li { display: flex; gap: 12px; padding: 12px 2px; border-bottom: 1px solid var(--line); align-items: flex-start; }

.li .mv s { color: var(--muted); }
.slot { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }

.slot .dt { flex: 1; } .slot .dt b { display: block; font-size: 15px; font-weight: 600; } .slot .dt small { color: var(--muted); font-size: 12.5px; }

.tabs button { border: 0; background: none; padding: 8px 12px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; gap: 6px; align-items: center; }

.mpick { display: flex; gap: 8px; flex-wrap: wrap; }
.mpick button { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line-strong); background: var(--panel); border-radius: 999px; padding: 3px 12px 3px 3px; font-weight: 500; }

    h += '<div class="card mcard"><div class="card-h">' + avatar(m) + '<div><h3>' + m.name + '</h3><div class="muted" style="font-size:12.5px">' + m.skills.map(t).join(", ") + '</div></div><span class="spacer"></span><button type="button" class="btn sm icon ghost">' + ic("pencil") + '</button></div><div class="card-b">' +
      '<div class="hint">' + t("workdays") + '</div><div class="days">' + [0, 1, 2, 3, 4, 5, 6].map(function (x) { return '<span class="' + (m.days.indexOf(x) !== -1 ? "on" : "") + '">' + WD1[lang][x] + "</span>"; }).join("") + "</div>" +
      '<div class="row"><span class="hint">' + t("load4") + '</span><span class="spacer"></span><b class="num">' + pct + '%</b></div><div class="meter"><i style="width:' + pct + '%"></i></div>' +
      '<div class="hint">' + t("timeOff") + "</div>" + (OFF.filter(function (x) { return x.m === m.id; }).map(function (x) { return '<div class="row"><span class="badge">' + ic(x.type === "holiday" ? "palmtree" : "calendar-off") + t(x.type) + '</span><span class="num">' + fmtShort(x.from) + (x.to !== x.from ? " – " + fmtShort(x.to) : "") + "</span></div>"; }).join("") || '<span class="muted">—</span>') +
      "</div></div>";
  });
  h += '</div><div class="cards" style="margin-top:14px"><div class="card"><div class="card-h"><h3>' + t("addTimeOff") + '</h3></div><div class="card-b stack"><div class="grid2"><div class="field"><label>' + t("mechanic") + "</label><select>" + MECHS.map(function (m) { return "<option>" + m.name + "</option>"; }).join("") + '</select></div><div class="field"><label>' + t("type") + "</label><select><option>" + t("holiday") + "</option><option>" + t("day_off") + "</option><option>" + t("sick") + '</option></select></div></div><div class="grid2"><div class="field"><label>' + t("from") + '</label><input type="date" value="2026-12-14"></div><div class="field"><label>' + t("to") + '</label><input type="date" value="2026-12-14"></div></div><div><button type="button" class="btn primary" data-act="saved">' + ic("plus") + t("add") + "</button></div></div></div>" +
    '<div class="card"><div class="card-h"><h3>' + t("closures") + '</h3><span class="spacer"></span><button type="button" class="btn sm" data-act="saved">' + ic("plus") + t("add") + '</button></div><div class="card-b"><div class="list">' + Object.keys(CLOSURES).map(function (k) { return '<div class="li"><div class="bd"><b>' + fmtDate(+k) + "</b><small>" + CLOSURES[k][lang === "lt" ? 1 : 0] + "</small></div></div>"; }).join("") + "</div></div></div></div>";
  return h;
}
function invoicesView() {

}

    '<section id="s-inv"><h3>' + t("invSet") + "</h3><p>" + t("invHint") + '</p><div class="stack"><label class="toggle"><input type="checkbox" id="vatPayer"' + (VAT.payer ? " checked" : "") + ">" + t("vatPayer") + '</label><div class="grid2">' + f("series", VAT.series) + f("nextNo", String(VAT.next).padStart(4, "0")) + '</div><div class="grid3">' + f("vatRate", VAT.rate, ' inputmode="numeric"') + f("rate", VAT.hourRate, ' inputmode="decimal"') + f("payDays", VAT.payDays, ' inputmode="numeric"') + "</div></div></section>" +
    '<section id="s-hours" style="border:0"><h3>' + t("hours") + "</h3><p>" + t("hoursHint") + '</p><div class="card"><table class="t"><tbody><tr><td>' + t("weekdays") + '</td><td class="num">08:00 – 18:00</td><td><span class="badge">4 ' + t("quarters") + "</span></td></tr><tr><td>" + t("saturday") + '</td><td class="num">09:00 – 14:00</td><td><span class="badge">2 ' + t("quarters") + "</span></td></tr><tr><td>" + t("sunday") + '</td><td class="muted">' + t("closed") + "</td><td></td></tr></tbody></table></div></section></div></div>";
}

/* ================= print ================= */
function co() { return { name: "MA Engine Lab", code: "000000000", vat: "LT000000000", addr: "Prienai, Lietuva", bank: "LT00 0000 0000 0000 0000", phone: "+370 600 00000" }; }
function paper(html) { $("overlay").innerHTML = '<div class="pv"><div class="pv-bar"><button type="button" class="btn primary" data-act="print">' + ic("printer") + t("print") + '</button><button type="button" class="btn" data-act="close">' + t("close") + '</button></div><div class="paper">' + html + "</div></div>"; icons(); }
function jobCard(id) {
  var j = job(id), c = cust(j.c), k = co(), e = endPos(j);
  var h = '<div class="top"><div><h1>' + t("jobCard") + '</h1><div style="color:#6b7280">#' + String(j.id).padStart(4, "0") + '</div></div><div class="co"><b>' + k.name + "</b><br>" + k.addr + "<br>" + k.phone + "</div></div>";
  h += '<div class="meta"><div><small>' + t("mechanic") + "</small><b>" + mech(j.mech).name + "</b></div><div><small>" + t("start") + "</small><b>" + fmtDate(j.d) + " " + qTime(j.d, j.q) + "</b></div><div><small>" + t("end") + "</small><b>" + fmtDate(e.d) + " " + e.t + "</b></div><div><small>" + t("duration") + "</small><b>" + fmtDays(j.dur) + "</b></div></div>";
  h += '<div class="two"><div class="pb"><div class="l">' + t("customer") + "</div><b>" + esc(c.name) + "</b><br>" + c.phone + '</div><div class="pb"><div class="l">' + t("vehicle") + "</div><b>" + esc(c.v.make) + " " + c.v.year + "</b><br>" + t("plate") + ": " + (c.v.plate || "—") + " · " + t("vin") + ": ________________<br>" + t("mileage") + ": ____________</div></div>";
  h += '<div class="pb" style="margin-bottom:16px"><div class="l">' + t("work") + '</div><b style="font-size:12pt">' + esc(j.work) + "</b></div>";
  h += '<div class="section">' + t("partsUsed") + '</div><table class="blank"><thead><tr><th>' + t("item") + '</th><th class="r" style="width:14%">' + t("qty") + "</th></tr></thead><tbody>" + "<tr><td></td><td></td></tr>".repeat(7) + "</tbody></table>";
  h += '<div class="section">' + t("notes") + '</div><div class="notes"></div><div class="sign"><div>' + t("received") + ", " + t("signature") + "</div><div>" + t("mechanic") + ", " + t("signature") + "</div></div>";
  paper(h);
}
function invLines(j) { return [{ n: t("labour") + ": " + j.work, q: j.dur * 2.5, u: t("hUnit"), p: VAT.hourRate }, { n: "Variklio alyva 5W-30, 5 l", q: 1, u: t("pcs"), p: 42 }, { n: "Alyvos filtras", q: 1, u: t("pcs"), p: 12.5 }]; }
function invTotals(j) { var s = invLines(j).reduce(function (a, l) { return a + l.q * l.p; }, 0), v = VAT.payer ? Math.round(s * VAT.rate) / 100 : 0; return { sub: s, vat: v, total: s + v }; }
function invoice(id) {
  var j = job(id), c = cust(j.c), k = co(), inv = INVOICES.filter(function (x) { return x.job === id; })[0], tt = invTotals(j);
  var no = inv ? inv.no : VAT.series + "-" + String(VAT.next).padStart(4, "0");
  var h = '<div class="top"><div><h1>' + t(VAT.payer ? "vatInvoice" : "invoiceTitle") + '</h1><span class="demo">demo</span></div><div class="co"><b>' + k.name + "</b><br>" + k.addr + "</div></div>";
  h += '<div class="meta"><div><small>' + t("invNo") + "</small><b>" + no + (inv ? "" : " (draft)") + "</b></div><div><small>" + t("issued") + "</small><b>" + iso(0) + "</b></div><div><small>" + t("payBy") + "</small><b>" + iso(VAT.payDays) + "</b></div></div>";
  h += '<div class="two"><div class="pb"><div class="l">' + t("seller") + "</div><b>" + k.name + "</b><br>" + t("companyCode") + ": " + k.code + (VAT.payer ? "<br>" + t("vatCode") + ": " + k.vat : "") + "<br>" + k.addr + "<br>" + k.bank + '</div><div class="pb"><div class="l">' + t("buyer") + "</div><b>" + esc(c.name) + "</b><br>" + c.phone + "<br>" + esc(c.v.make) + (c.v.plate ? " · " + c.v.plate : "") + "</div></div>";
  h += "<table><thead><tr><th>#</th><th>" + t("item") + '</th><th class="r">' + t("qty") + "</th><th>" + t("unit") + '</th><th class="r">' + t("price") + '</th><th class="r">' + t("amount") + "</th></tr></thead><tbody>";
  invLines(j).forEach(function (l, i) { h += "<tr><td>" + (i + 1) + "</td><td>" + esc(l.n) + '</td><td class="r">' + String(l.q).replace(".", lang === "lt" ? "," : ".") + "</td><td>" + l.u + '</td><td class="r">' + money(l.p) + '</td><td class="r">' + money(l.q * l.p) + "</td></tr>"; });
  h += '</tbody></table><table class="tot"><tbody>' + (VAT.payer ? "<tr><td>" + t("subtotal") + '</td><td class="r">' + money(tt.sub) + "</td></tr><tr><td>" + t("vat") + " " + VAT.rate + '%</td><td class="r">' + money(tt.vat) + "</td></tr>" : "") + '<tr class="g"><td>' + t("total") + '</td><td class="r">' + money(tt.total) + "</td></tr></tbody></table>";
  h += '<div class="sign"><div>' + t("issuedBy") + "</div><div>" + t("buyer") + ", " + t("signature") + '</div></div><p class="demo" style="margin-top:20px">' + t("editLines") + "</p>";
  paper(h);
}

/* ================= events ================= */
document.addEventListener("click", function (e) {
  var qr = $("qres"); if (!e.target.closest(".search")) qr.hidden = true;
  var cell = e.target.closest(".cell");
  if (cell && !/sun|closed|off/.test(cell.className)) {
    var d = +cell.dataset.d, r = cell.getBoundingClientRect(), q = Math.min(wsQ(d) - 1, Math.floor((e.clientX - r.left) / (r.width / units(d))));
    openNew({ m: cell.dataset.m, d: d, q: q }); return;
  }
  var b = e.target.closest("button, tr.click, a[data-act]"); if (!b) return;
  var a = b.dataset;
  if (a.page) { state.page = a.page; closeOverlay(); render(); scrollTo(0, 0); return; }
  if (a.view) { state.view = a.view; if (a.view === "day") state.pick = Math.max(state.start, 0); render(); return; }
  if (a.pick) { state.pick = +a.pick; render(); return; }
  if (a.job && !a.status) { openJob(+a.job); return; }
  if (a.cust) { $("qres").hidden = true; $("q").value = ""; openCustomer(+a.cust); return; }
  if (a.filter) { state.filter = a.filter; render(); return; }
  if (a.lang) { lang = a.lang; try { localStorage.setItem("maw2-lang", lang); } catch (x) {} render(); return; }
  if (a.theme) { state.theme = a.theme; try { localStorage.setItem("maw2-theme", state.theme); } catch (x) {} render(); return; }
  if (a.tab) { openInbox(a.tab); return; }
  if (a.informed) { job(+a.informed).notify = null; render(); if (document.querySelector(".tabs")) openInbox(); else closeOverlay(); toast(t("saved")); return; }
  if (a.early) { var p = a.early.split(":"), jj = job(+p[0]), w = WQ[+p[1]]; jj.d = w.d; jj.q = w.q; jj.notify = "earlier"; render(); openInbox("call"); toast(t("moved")); return; }
  if (a.status) { var s = a.status.split(":"); job(+s[0]).status = s[1]; render(); openJob(+s[0]); return; }
  if (a.dur) { var x = a.dur.split(":"), j = job(+x[0]); j.dur = Math.max(1, j.dur + (+x[1])); render(); openJob(j.id); return; }
  if (a.finish) { var jf = job(+a.finish); jf.dur = Math.max(1, NOW + 1 - sIdx(jf)); jf.status = "completed"; closeOverlay(); render(); toast(t("saved")); return; }
  if (a.move) {
    var jm = job(+a.move), nd = fromIso($("mvD").value), nq = +$("mvQ").value;
    if (qi(nd, nq) < 0) { toast(t("closedThen")); return; }
    var before = sIdx(jm); jm.mech = $("mvM").value; jm.d = nd; jm.q = nq;
    if (qi(nd, nq) !== before && jm.status === "scheduled" && nd !== WQ[before].d) jm.notify = qi(nd, nq) < before ? "earlier" : "later";
    render(); openJob(jm.id); toast(t("moved")); return;
  }
  if (a.card) { jobCard(+a.card); return; }
  if (a.invoice) { invoice(+a.invoice); return; }
  if (a.book) { var k = a.book.split(":"); openNew({ m: k[0], d: +k[1], q: +k[2], dur: +k[3] }); return; }
  if (a.newfor) { openNew({ c: +a.newfor }); return; }
  if (a.fdur) { openFind(+a.fdur, state.find.vt); return; }
  if (a.ftype) { openFind(state.find.dur, a.ftype); return; }
  if (a.npick) { state.newM = a.npick; b.parentNode.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", x === b); }); newInfo(); return; }
  if (a.cpick) { state.newC = +a.cpick; custList(""); return; }
  if (a.cclear) { state.newC = null; custList($("cFind").value); return; }
  if (a.ctab) { $("cEx").hidden = a.ctab !== "ex"; $("cNew").hidden = a.ctab === "ex"; b.parentNode.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", x === b); }); return; }
  switch (a.act) {
    case "close": closeOverlay(); break;
    case "prev": state.start -= state.view === "month" ? 28 : 7; render(); break;
    case "next": state.start += state.view === "month" ? 28 : 7; render(); break;
    case "today": state.start = 0; state.pick = 0; render(); break;
    case "find": openFind(); break;
    case "inbox": openInbox(); break;
    case "new": openNew(); break;
    case "saved": toast(t("saved")); break;
    case "print": print(); break;
    case "saveNew":
      var nd2 = fromIso($("nD").value), nq2 = +$("nQ").value;
      if (qi(nd2, nq2) < 0) { toast(t("closedThen")); break; }
      JOBS.push({ id: nextId++, c: state.newC || 1, work: $("nWork").value || "—", mech: state.newM, d: nd2, q: nq2, dur: +$("nDur").value, orig: +$("nDur").value, status: "scheduled", notify: null });
      closeOverlay(); render(); toast(t("saved")); break;
  }
});
document.addEventListener("change", function (e) {
  var id = e.target.id;
  if (id === "nD" || id === "mvD") $(id === "nD" ? "nQ" : "mvQ").innerHTML = qOpts(fromIso(e.target.value), 0);
  if (["nD", "nQ", "nDur"].indexOf(id) !== -1) newInfo();
  if (id === "vatPayer") VAT.payer = e.target.checked;
});
document.addEventListener("input", function (e) {
  var id = e.target.id;
  if (id === "cFind") custList(e.target.value);
  if (id === "cq") { var q = e.target.value.toLowerCase().replace(/\s/g, ""); document.querySelectorAll("#ctbl tbody tr").forEach(function (r) { r.hidden = r.dataset.s.indexOf(q) === -1; }); }
  if (id === "q") {
    var term = e.target.value.toLowerCase().replace(/\s/g, ""), box = $("qres");
    if (!term) { box.hidden = true; return; }
    var res = CUST.filter(function (c) { return (c.name + c.phone + c.v.plate + c.v.make).toLowerCase().replace(/\s/g, "").indexOf(term) !== -1; }).slice(0, 6);
    box.innerHTML = res.length ? res.map(function (c) { return '<button type="button" data-cust="' + c.id + '"><span class="av sm cust">' + initials(c.name) + '</span><span style="flex:1;min-width:0"><b style="font-weight:500">' + esc(c.name) + '</b><br><small class="muted">' + c.phone + " · " + esc(c.v.make) + "</small></span>" + plate(c.v.plate) + "</button>"; }).join("") : '<div class="empty">' + t("noResults") + "</div>";
    box.hidden = false;
  }
});
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") { closeOverlay(); $("qres").hidden = true; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("q").focus(); }
});
render();
})();
